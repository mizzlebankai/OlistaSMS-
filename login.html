<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Portal Login | Olistar School</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/sms.css">
</head>
<body class="sms-login-body d-flex align-items-center py-5">
    <div class="container">
        <div class="card sms-login-card bg-white rounded-0 shadow-lg mx-auto">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <img src="assets/logo.png" alt="Olistar" height="64"
                         onerror="this.src='https://placehold.co/80x80/900C3F/ffffff?text=OS'">
                    <h1 class="h4 font-serif fw-bold mt-3 sms-brand">Olistar School Portal</h1>
                    <p class="small text-muted mb-0">Students, teachers, and administrators</p>
                </div>
                <div id="loginAlert" class="alert d-none rounded-0" role="alert"></div>
                <ul class="nav nav-pills nav-justified mb-4" id="roleTabs">
                    <li class="nav-item"><button type="button" class="nav-link active rounded-0" data-role="student">Student</button></li>
                    <li class="nav-item"><button type="button" class="nav-link rounded-0" data-role="teacher">Teacher</button></li>
                    <li class="nav-item"><button type="button" class="nav-link rounded-0" data-role="admin">Admin</button></li>
                </ul>
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label small text-uppercase fw-bold" id="emailLabel">Institutional login ID</label>
                        <input type="text" class="form-control rounded-0" id="loginEmail" required autocomplete="username" placeholder="e.g. name2026@students.olistar.edu.gh or OLS...">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-uppercase fw-bold">Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control rounded-0 border-end-0" id="loginPassword" required autocomplete="current-password" placeholder="Enter your password">
                            <button class="btn btn-outline-secondary rounded-0 border-start-0 toggle-password-btn" type="button" data-target="loginPassword" title="Show/Hide Password" aria-label="Toggle password visibility">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-crimson w-100 py-2" id="loginBtn">Sign in</button>
                </form>
                <div class="d-flex justify-content-between align-items-center mt-3 small">
                    <a href="reset-password.html" class="text-decoration-none" style="color:#900C3F">Forgot password?</a>
                    <button type="button" id="openResendBtn" class="btn btn-link p-0 small text-decoration-none" style="color:#900C3F">Resend verification link</button>
                </div>
                <div class="text-center mt-3 small">
                    <a href="https://olistaredu.netlify.app/" class="text-muted text-decoration-none" target="_blank" rel="noopener"><i class="bi bi-globe me-1"></i> Return to Public Website</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Resend Verification Modal -->
    <div class="modal fade" id="resendModal" tabindex="-1" aria-labelledby="resendModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-0">
                <div class="modal-header">
                    <h5 class="modal-title font-serif fw-bold" id="resendModalLabel">Resend Verification Link</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="resendForm">
                    <div class="modal-body">
                        <div id="resendAlert" class="alert d-none rounded-0" role="alert"></div>
                        <p class="small text-muted mb-3">
                            Enter your institutional login ID (or student code) and password. We will send a fresh email verification link to your registered contact email address.
                        </p>
                        <div class="mb-3">
                            <label class="form-label small text-uppercase fw-bold">Login ID / Student Code</label>
                            <input type="text" class="form-control rounded-0" id="resendEmail" required placeholder="e.g. name2026@students.olistar.edu.gh or OLS...">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-uppercase fw-bold">Password</label>
                            <div class="input-group">
                                <input type="password" class="form-control rounded-0 border-end-0" id="resendPassword" required autocomplete="current-password" placeholder="Enter your account password">
                                <button class="btn btn-outline-secondary rounded-0 border-start-0 toggle-password-btn" type="button" data-target="resendPassword" title="Show/Hide Password" aria-label="Toggle password visibility">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary rounded-0" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-crimson rounded-0" id="resendSubmitBtn">Send Verification Link</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/pages/login.js"></script>
</body>
</html>
