<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance | Olistar School Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/sms.css">
</head>
<body>
<div id="sms-shell">
    <div id="staffAttendance">
        <form id="attForm" class="row g-2 align-items-end mb-3">
            <div class="col-md-4"><label class="form-label">Class</label><select id="attClass" class="form-select rounded-0"></select></div>
            <div class="col-md-3"><label class="form-label">Date</label><input type="date" id="attDate" class="form-control rounded-0"></div>
            <div class="col-md-2"><button class="btn btn-crimson" type="submit">Save roll</button></div>
        </form>
        <div id="attRoster"></div>
        <div id="attendanceRecords" class="mt-4"></div>
    </div>
    <div id="studentAttendance" class="d-none"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/pages/attendance.js"></script>
</body>
</html>
