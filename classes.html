<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classes | Olistar School Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/sms.css">
</head>
<body>
<div id="sms-shell">
    <form id="classForm" class="row g-2 align-items-end mb-4">
        <div class="col-md-3"><label class="form-label">Class name</label><input name="name" class="form-control rounded-0" required placeholder="JHS 2A"></div>
        <div class="col-md-3"><label class="form-label">Division</label><input name="academicTier" class="form-control rounded-0" placeholder="Junior High"></div>
        <div class="col-md-2"><label class="form-label">Batch</label><input name="yearBatch" class="form-control rounded-0" value="2026/2027"></div>
        <div class="col-md-2"><label class="form-label">Teacher</label><select name="teacherId" id="classTeacher" class="form-select rounded-0"></select></div>
        <div class="col-md-2"><button class="btn btn-crimson w-100" type="submit">Add class</button></div>
    </form>
    <form id="subjectForm" class="row g-2 align-items-end mb-4">
        <div class="col-md-4"><label class="form-label">Subject</label><input name="name" class="form-control rounded-0" required placeholder="Mathematics"></div>
        <div class="col-md-4"><label class="form-label">Class (optional)</label><select name="classId" id="subjectClass" class="form-select rounded-0"></select></div>
        <div class="col-md-2"><button class="btn btn-outline-dark rounded-0 w-100" type="submit">Add subject</button></div>
    </form>
    <div class="row">
        <div class="col-md-6"><h2 class="h5">Classes</h2><ul class="list-group rounded-0" id="classList"></ul></div>
        <div class="col-md-6"><h2 class="h5">Subjects</h2><ul class="list-group rounded-0" id="subjectList"></ul></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/pages/classes.js"></script>
</body>
</html>
