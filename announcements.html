<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements | Olistar School Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/sms.css">
</head>
<body>
<div id="sms-shell">
    <form id="noticeForm" class="card rounded-0 p-3 mb-4">
        <h2 class="h5 font-serif">Post notice</h2>
        <input id="noticeTitle" class="form-control rounded-0 mb-2" placeholder="Title" required>
        <textarea id="noticeBody" class="form-control rounded-0 mb-2" rows="3" required></textarea>
        <select id="noticeAudience" class="form-select rounded-0 mb-2">
            <option value="all">Everyone</option>
            <option value="students">Students</option>
            <option value="teachers">Teachers</option>
        </select>
        <button class="btn btn-crimson" type="submit">Publish</button>
    </form>
    <div id="noticeList"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/pages/announcements.js"></script>
</body>
</html>
