<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachers & Staff | Olistar School Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/sms.css">
</head>
<body>
<div id="sms-shell">
    <div class="d-flex justify-content-end mb-3">
        <button class="btn btn-crimson btn-sm" data-bs-toggle="modal" data-bs-target="#staffModal">Enroll staff</button>
    </div>
    <div class="table-responsive">
        <table class="table">
            <thead><tr><th>Name</th><th>Role</th><th>Login ID</th><th>Contact</th><th>Account</th><th class="text-end">Actions</th></tr></thead>
            <tbody id="staffBody"></tbody>
        </table>
    </div>
</div>
<div class="modal fade" id="staffModal" tabindex="-1">
    <div class="modal-dialog">
        <form class="modal-content rounded-0" id="staffForm">
            <div class="modal-header"><h5 class="modal-title font-serif">Enroll teacher / staff</h5>
                <button class="btn-close" data-bs-dismiss="modal" type="button"></button></div>
            <div class="modal-body">
                <label class="form-label">Full name</label>
                <input name="name" class="form-control rounded-0 mb-2" required>
                <label class="form-label">Phone</label>
                <input name="phone" class="form-control rounded-0 mb-2">
                <label class="form-label">Contact email (verification)</label>
                <input type="email" name="contactEmail" class="form-control rounded-0 mb-2" required>
                <label class="form-label">Role</label>
                <select name="role" class="form-select rounded-0 mb-2">
                    <option value="teacher">Teacher</option>
                    <option value="staff">Staff</option>
                </select>
            </div>
            <div class="modal-footer"><button class="btn btn-crimson" type="submit">Generate login</button></div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/pages/teachers.js"></script>
</body>
</html>
