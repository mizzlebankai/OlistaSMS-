<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password | Olistar School Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/sms.css">
</head>
<body class="sms-login-body d-flex align-items-center py-5">
    <div class="container">
        <div class="card sms-login-card bg-white rounded-0 shadow mx-auto">
            <div class="card-body p-4 p-md-5">
                <h1 class="h4 font-serif sms-brand">Reset password</h1>
                <p class="small text-muted">Students and teachers: enter your institutional login ID. The reset link goes to your contact email.</p>
                <div id="resetAlert" class="alert d-none rounded-0"></div>
                <form id="resetForm">
                    <label class="form-label small text-uppercase fw-bold">Institutional login ID</label>
                    <input type="email" id="resetEmail" class="form-control rounded-0 mb-3" required>
                    <button class="btn btn-crimson w-100" type="submit">Send reset link</button>
                </form>
                <a href="login.html" class="d-block text-center mt-3 small" style="color:#900C3F">Back to login</a>
            </div>
        </div>
    </div>
    <script type="module" src="js/pages/reset-password.js"></script>
</body>
</html>
