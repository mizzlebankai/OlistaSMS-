[build]
  publish = "."

[[redirects]]
  from = "/api/delete-auth-user"
  to = "/.netlify/functions/delete-auth-user"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/"
  to = "/login.html"
  status = 302