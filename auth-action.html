<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account action | Olistar School Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/sms.css">
</head>
<body class="sms-login-body d-flex align-items-center py-5">
    <div class="container">
        <div class="card sms-login-card bg-white rounded-0 shadow mx-auto">
            <div class="card-body p-4 p-md-5">
                <h1 class="h4 font-serif sms-brand">Account confirmation</h1>
                <p id="actionStatus" class="text-muted">Processing the link from your email…</p>
                <form id="newPasswordForm" class="d-none">
                    <label class="form-label small text-uppercase fw-bold">New password</label>
                    <div class="input-group mb-3">
                        <input type="password" id="newPassword" class="form-control rounded-0 border-end-0" minlength="8" required placeholder="Enter new password">
                        <button class="btn btn-outline-secondary rounded-0 border-start-0 toggle-password-btn" type="button" data-target="newPassword" title="Show/Hide Password" aria-label="Toggle password visibility">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <button class="btn btn-crimson w-100" type="submit">Save password</button>
                </form>
                <a href="login.html" class="btn btn-outline-dark rounded-0 w-100 mt-3">Go to login</a>
            </div>
        </div>
    </div>
    <script type="module" src="js/pages/auth-action.js"></script>
</body>
</html>
